<html lang="th">

<title>ตารางอ่านหนังสือ OB-GYN</title>

<style id="css">
/* Retro 8-bit game look: sky-blue world, chunky outlined blocks with hard pixel shadows, brick ground strip.
   Layout: topic tray (left / sticky on phone) + calendar of study days until MCQ (4 ธ.ค.) */
:root{
  --sky:#5c94fc; --sky2:#7fb0ff; --ink:#111111; --block:#fff6e0; --block2:#f2e2b8;
  --brick:#c84c0c; --brick-dark:#7a2a04; --gold:#fcbc3c; --white:#ffffff; --muted:#5a4a3a;
  --c-lec:#2a5bd7; --c-tt:#9b3fd6; --c-topic:#1a9c3a; --c-opob:#e05c00; --c-oth:#6a6a6a; --c-own:#d6286e;
  --exam:#e01020; --duty:#7a5a00; --today:#fcbc3c; --accent:#e01020;
  --font-pixel:"Press Start 2P","Kanit",monospace;
  --font-display:"Kanit","IBM Plex Sans Thai",system-ui,sans-serif;
  --font-body:"Kanit","IBM Plex Sans Thai",system-ui,-apple-system,sans-serif;
  --px:3px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;font-weight:400}
body{background:
  linear-gradient(var(--sky),var(--sky)) ;
  min-height:100%;padding-bottom:56px;position:relative}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:40px;z-index:30;pointer-events:none;
  background-color:var(--brick);
  background-image:
    linear-gradient(var(--brick-dark) 3px,transparent 3px),
    linear-gradient(90deg,var(--brick-dark) 3px,transparent 3px),
    linear-gradient(90deg,transparent 22px,var(--brick-dark) 22px,var(--brick-dark) 25px,transparent 25px);
  background-size:100% 20px,50px 20px,50px 40px;
  background-position:0 0,0 0,0 20px;
  border-top:3px solid var(--ink)}
.clouds{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 12% 14%,#fff 0 22px,transparent 23px),
    radial-gradient(circle at 15% 12%,#fff 0 28px,transparent 29px),
    radial-gradient(circle at 18% 14%,#fff 0 20px,transparent 21px),
    radial-gradient(circle at 72% 9%,#fff 0 18px,transparent 19px),
    radial-gradient(circle at 75% 7%,#fff 0 24px,transparent 25px),
    radial-gradient(circle at 78% 9%,#fff 0 18px,transparent 19px);
  opacity:.9}
button{font:inherit;color:inherit}
a{color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible,.item:focus-visible{outline:3px dashed var(--gold);outline-offset:2px}
.app{position:relative;z-index:1;display:grid;grid-template-columns:330px 1fr;gap:18px;padding:18px;max-width:1400px;margin:0 auto;align-items:start}
header.top{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--font-pixel);font-weight:400;font-size:1.15rem;line-height:1.6;margin:0;color:var(--white);text-shadow:3px 3px 0 var(--ink);text-wrap:balance}
h1 .th{font-family:var(--font-display);font-weight:700;font-size:1.5rem;display:block;letter-spacing:.01em}
.sub{color:var(--white);font-size:.9rem;margin-top:4px;text-shadow:2px 2px 0 rgba(0,0,0,.45)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--ink);color:var(--white);border:3px solid var(--white);box-shadow:4px 4px 0 var(--ink);padding:6px 12px;font-size:.82rem;font-variant-numeric:tabular-nums}
.stat b{font-family:var(--font-pixel);font-weight:400;font-size:.85rem;color:var(--gold);margin:0 2px}
.stat.exam b{color:#ff6b6b}
.save{font-size:.78rem;color:var(--white);min-width:7em;text-align:right;text-shadow:1px 1px 0 var(--ink)}

/* blocks */
.tray,.day,.legend,.toolbar button,.filters button,.addown input,.addown button{border:3px solid var(--ink)}
.tray{background:var(--block);box-shadow:6px 6px 0 var(--ink);padding:12px;position:sticky;top:12px;max-height:calc(100vh - 80px);overflow:auto}
.tray h2{font-family:var(--font-pixel);font-weight:400;font-size:.75rem;margin:0 0 6px;letter-spacing:.02em}
.hint{color:var(--muted);font-size:.8rem;margin:0 0 10px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{background:var(--white);padding:3px 10px;font-size:.8rem;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.filters button[aria-pressed="true"]{background:var(--gold)}
.filters button:active,.toolbar button:active,.addown button:active{transform:translate(3px,3px);box-shadow:none}
.group{margin-bottom:14px}
.group h3{display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:600;margin:0 0 6px}
.group h3 .dot{width:12px;height:12px;background:var(--cat);border:2px solid var(--ink)}
.group h3 .cnt{margin-left:auto;font-family:var(--font-pixel);font-size:.6rem;font-weight:400}
.items{display:flex;flex-direction:column;gap:6px}
.item{display:flex;gap:8px;align-items:center;text-align:left;width:100%;background:var(--white);border:3px solid var(--ink);border-left:10px solid var(--cat);box-shadow:3px 3px 0 var(--ink);padding:6px 8px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-size:.86rem}
.item:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.item.sel{background:var(--gold)}
.item .t{flex:1;min-width:0}
.item .d{color:var(--muted);font-size:.74rem;display:block}
.item .n{font-family:var(--font-pixel);font-size:.55rem;color:var(--white);background:var(--cat);border:2px solid var(--ink);padding:3px 5px;align-self:center;min-width:22px;text-align:center}
.item .n.zero{background:var(--white);color:var(--muted)}
.vid{flex:none;display:inline-flex;align-items:center;gap:4px;text-decoration:none;background:var(--exam);color:var(--white);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);padding:2px 5px;font-family:var(--font-pixel);font-size:.5rem;line-height:1.4;cursor:pointer}
.vid svg{width:9px;height:9px;fill:currentColor;flex:none}
.vid:hover{background:#ff3344}
.vid:active{transform:translate(2px,2px);box-shadow:none}
.chip{flex-wrap:wrap}
.chip .lbl{flex:1 1 55%}
.chip [data-act="del"]{order:1}
.chip .vid{order:2;margin-left:20px;padding:1px 4px;font-size:.45rem}
.addown{display:flex;gap:6px;margin-top:6px}
.addown input{flex:1;min-width:0;background:var(--white);padding:6px 8px;font:inherit;font-size:.84rem;color:var(--ink)}
.addown button{background:var(--c-topic);color:var(--white);padding:6px 10px;cursor:pointer;font-size:.84rem;box-shadow:3px 3px 0 var(--ink)}

/* calendar */
.cal{display:flex;flex-direction:column;gap:16px;min-width:0}
.week h2{display:inline-block;font-family:var(--font-display);font-size:.95rem;margin:0 0 8px;font-weight:600;background:var(--ink);color:var(--white);padding:3px 10px}
.week h2 .w{font-family:var(--font-pixel);font-size:.55rem;color:var(--gold);margin-right:8px;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--block);box-shadow:4px 4px 0 var(--ink);min-height:150px;padding:6px;display:flex;flex-direction:column;gap:4px;
  background-image:linear-gradient(var(--block2) 3px,transparent 3px);background-size:100% 100%;background-repeat:no-repeat}
.day.past,.day.after{opacity:.5;filter:grayscale(.4)}
.day.today{background-color:#fff0b0;outline:3px solid var(--gold);outline-offset:3px}
.day.over{background-color:var(--gold);transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.day.target{cursor:copy}
.dh{display:flex;align-items:baseline;gap:6px}
.dh .num{font-family:var(--font-pixel);font-size:.85rem}
.dh .wd{color:var(--muted);font-size:.75rem}
.dh .load{margin-left:auto;font-size:.68rem;color:var(--muted)}
.mk{font-size:.72rem;padding:1px 6px;line-height:1.35;border:2px solid var(--ink)}
.mk.exam{background:var(--exam);color:var(--white);font-weight:600}
.mk.duty{background:var(--white);border-style:dashed;color:var(--duty);font-weight:600}
.mk.note{background:var(--block2);border-color:transparent;color:var(--muted)}
.chips{display:flex;flex-direction:column;gap:4px;flex:1}
.chip{display:flex;align-items:flex-start;gap:4px;background:var(--white);border:2px solid var(--ink);border-left:7px solid var(--cat);padding:3px 4px;font-size:.76rem;line-height:1.3;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.chip .lbl{flex:1;min-width:0;overflow-wrap:anywhere}
.chip.done{background:#e4f6e0}
.chip.done .lbl{text-decoration:line-through;color:var(--muted)}
.chip button{border:0;background:transparent;padding:0 2px;cursor:pointer;line-height:1;font-size:.95rem;color:var(--muted)}
.chip .ck{width:16px;height:16px;border:2px solid var(--ink);background:var(--white);flex:none;margin-top:1px;display:grid;place-items:center;font-size:.7rem;color:var(--ink);padding:0}
.chip.done .ck{background:var(--gold)}
.empty{color:var(--muted);font-size:.72rem;opacity:.75;margin-top:auto}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;background:var(--block);padding:6px 10px;box-shadow:4px 4px 0 var(--ink);align-self:flex-start}
.legend span{display:inline-flex;align-items:center;gap:5px}
.ghost{position:fixed;z-index:50;pointer-events:none;background:var(--gold);border:3px solid var(--ink);border-left:10px solid var(--cat);padding:5px 9px;font-size:.84rem;box-shadow:5px 5px 0 var(--ink);max-width:240px;transform:translate(-50%,-120%)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar button{background:var(--white);padding:5px 10px;font-size:.8rem;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
#confirm{color:var(--white);text-shadow:1px 1px 0 var(--ink)}
.selbar{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);background:var(--ink);color:var(--white);border:3px solid var(--white);padding:8px 14px;font-size:.84rem;z-index:40;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px);box-shadow:4px 4px 0 rgba(0,0,0,.4)}
.selbar button{border:0;background:transparent;color:var(--gold);text-decoration:underline;cursor:pointer;padding:0}
.ro{font-size:.78rem;color:var(--exam)}
.trayhead{display:flex;align-items:center;gap:8px}
.trayhead h2{flex:1}
.trayhead button{display:none;border:2px solid var(--ink);background:var(--white);padding:2px 10px;font-size:.8rem;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}

@media (max-width:820px){
  .app{grid-template-columns:1fr;padding:12px}
  h1{font-size:.85rem}
  .tray{position:sticky;top:0;z-index:20;max-height:42vh;margin:0 -12px;border-left:0;border-right:0;border-top:0;box-shadow:0 4px 0 var(--ink)}
  .tray.collapsed .body{display:none}
  .trayhead button{display:inline-block}
  .grid{grid-template-columns:1fr}
  .day{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:flex-start}
  .dh{width:100%}
  .day .chips{width:100%}
  .day.past{display:none}
  .empty{margin-top:0}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}.item:hover,.day.over{transform:none}}
</style>

let state;
try{ state=JSON.parse(document.getElementById('state').textContent); }catch(e){ state={placements:{},custom:[],seq:1}; }
state.placements=state.placements||{}; state.custom=state.custom||[]; state.seq=state.seq||1;

  h+='<aside class="tray'+(collapsed?' collapsed':'')+'"><div class="trayhead"><h2>หัวข้อทั้งหมด</h2><button type="button" id="tg">'+(collapsed?'แสดง':'ซ่อน')+'</button></div><div class="body">';
  h+='<p class="hint">ตัวเลขด้านขวา = จำนวนวันที่ลงไว้แล้ว · ปุ่ม VIDEO เปิดคลิปใน YouTube (มี '+Object.keys(VIDEOS).length+' หัวข้อ)</p><div class="filters">';
  h+='<button type="button" data-f="all" aria-pressed="'+(filter==='all')+'">ทั้งหมด</button><button type="button" data-f="un" aria-pressed="'+(filter==='un')+'">ยังไม่ลง</button>';
  h+='</div>';
  for(const c of CATS){
    let list=all.filter(i=>i.cat===c.k); if(filter==='un') list=list.filter(i=>countPlaced(i.id)===0);
    if(c.k!=='own' && !list.length) continue;
    const tot=all.filter(i=>i.cat===c.k).length, sc=all.filter(i=>i.cat===c.k && countPlaced(i.id)>0).length;
    h+='<div class="group" style="--cat:'+catVar(c.k)+'"><h3><span class="dot"></span>'+esc(c.name)+'<span class="cnt">'+sc+'/'+tot+'</span></h3><div class="items">';
    for(const i of list){ const n=countPlaced(i.id);
      h+='<div class="item'+(selected===i.id?' sel':'')+'" role="button" tabindex="0" data-id="'+i.id+'" style="--cat:'+catVar(i.cat)+'"><span class="t">'+esc(i.title)+(i.date?'<span class="d">เรียน '+esc(i.date)+'</span>':'')+'</span>'+vidLink(i.id)+'<span class="n'+(n?'':' zero')+'">'+n+'</span></div>'; }
    if(c.k==='own') h+='<form class="addown" id="addown"><input id="owninput" placeholder="เช่น ทบทวน PSL, ทำข้อสอบเก่า" aria-label="เพิ่มหัวข้อเอง"><button type="submit">เพิ่ม</button></form>';
    h+='</div></div>';
  }
  h+='</div></aside>';

  // calendar
  h+='<main class="cal"><div class="legend"><span><span class="mk exam">สอบ</span></span><span><span class="mk duty">เวร</span></span><span><span class="mk note">คาบสำคัญ</span></span>'+(canPublish?'':'<span class="ro">ดูอย่างเดียว: บันทึกได้เฉพาะในเครื่องนี้</span>')+'</div>';
  let d=new Date(START+'T00:00:00Z'), wk=0;
  while(iso(d)<=END){
    const ws=new Date(d), we=new Date(d); we.setUTCDate(we.getUTCDate()+6);
    h+='<section class="week"><h2><span class="w">WORLD '+(wk+1)+'</span>สัปดาห์ '+ws.getUTCDate()+' '+MON[ws.getUTCMonth()]+' – '+we.getUTCDate()+' '+MON[we.getUTCMonth()]+'</h2><div class="grid">';
    for(let k=0;k<7;k++){
      const key=iso(d); const cls=['day'];
      if(key<today) cls.push('past'); if(key===today) cls.push('today'); if(key>LAST) cls.push('after');
      if(selected) cls.push('target');
      const ps=state.placements[key]||[];
      h+='<div class="'+cls.join(' ')+'" data-day="'+key+'"><div class="dh"><span class="num">'+d.getUTCDate()+'</span><span class="wd">'+WD[k]+' '+MON[d.getUTCMonth()]+'</span>'+(ps.length?'<span class="load">'+ps.length+' หัวข้อ</span>':'')+'</div>';
      for(const m of (MARKS[key]||[])) h+='<div class="mk '+m[0]+'">'+esc(m[1])+'</div>';
      h+='<div class="chips">';
      for(const p of ps){ const it=byId(p.id); if(!it) continue;
        h+='<div class="chip'+(p.done?' done':'')+'" data-uid="'+p.uid+'" data-from="'+key+'" style="--cat:'+catVar(it.cat)+'"><button type="button" class="ck" data-act="done" aria-label="อ่านจบ">'+(p.done?'✓':'')+'</button><span class="lbl">'+esc(it.title)+'</span>'+vidLink(it.id)+'<button type="button" data-act="del" aria-label="เอาออก">×</button></div>'; }
      if(!ps.length && key>=today && key<=LAST) h+='<div class="empty">วางหัวข้อที่นี่</div>';
      h+='</div></div>';
      d.setUTCDate(d.getUTCDate()+1);
    }
    h+='</div></section>'; wk++;
  }
  h+='<div class="toolbar"><button type="button" id="clearall">ล้างตารางทั้งหมด</button><span id="confirm"></span></div>';
  h+='</main></div>';
  if(selected){ const it=byId(selected); if(it) h+='<div class="selbar" role="status">เลือก: '+esc(it.title)+' — แตะวันที่จะอ่าน <button type="button" id="cancelsel">ยกเลิก</button></div>'; }
  root.innerHTML=h;
}

function mutate(fn){ fn(); state.ts=Date.now(); try{ localStorage.setItem('obgyn-planner',JSON.stringify(state)); }catch(e){} render(); schedulePublish(); }
function place(id,day){ if(day>END) return; mutate(()=>{ (state.placements[day]=state.placements[day]||[]).push({id,uid:'u'+(state.seq++),done:false}); }); }
function move(uid,from,to){ if(from===to) return; mutate(()=>{ const a=state.placements[from]||[]; const ix=a.findIndex(p=>p.uid===uid); if(ix<0) return; const [p]=a.splice(ix,1); if(!a.length) delete state.placements[from]; (state.placements[to]=state.placements[to]||[]).push(p); }); }

function buildDoc(){
  const css=document.getElementById('css').textContent, app=document.getElementById('app').textContent;
  const st=JSON.stringify(state).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="th">\n<head>\n'+HEAD+'<style id="css">'+css+'</style>\n</head>\n<body>\n<div id="root"></div>\n<script id="state" type="application/json">'+st+'<\/script>\n<script id="app">'+app+'<\/script>\n</body>\n</html>\n';
}
function setSave(m){ saveMsg=m; const el=document.getElementById('save'); if(el) el.textContent=m; }
function schedulePublish(){
  if(!artifact||!canPublish){ setSave('บันทึกในเครื่องนี้แล้ว'); return; }
  setSave('กำลังบันทึก…'); clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{ await artifact.publish(buildDoc()); setSave('บันทึกแล้ว'); }
    catch(e){ const c=e&&(e.code||e.name||e.message)||''; if(/not_granted|not_writer/.test(c)){ canPublish=false; setSave('บันทึกในเครื่องนี้แล้ว'); render(); } else if(/conflict/.test(c)){ setSave('มีการแก้จากที่อื่น กำลังโหลดใหม่'); } else setSave('บันทึกไม่สำเร็จ ลองอีกครั้ง'); }
  },1200);
}

/* ---------- interactions ---------- */
let drag=null; // {kind:'item'|'chip', id, uid, from, ghost, x,y, started}
function dayAt(x,y){ const el=document.elementFromPoint(x,y); return el&&el.closest?el.closest('.day'):null; }
function clearGhosts(){ document.querySelectorAll('.ghost').forEach(g=>g.remove()); document.querySelectorAll('.day.over').forEach(d=>d.classList.remove('over')); }
function cancelDrag(){ if(tp){ clearTimeout(tp.timer); tp=null; } drag=null; pd=null; lastOver=null; clearGhosts(); document.body.style.userSelect=''; }
function startDrag(info,x,y){
  clearGhosts(); drag=null;
  const it=byId(info.id); if(!it) return;
  const g=document.createElement('div'); g.className='ghost'; g.style.setProperty('--cat',catVar(it.cat)); g.textContent=it.title; document.body.appendChild(g);
  drag=Object.assign(info,{ghost:g,started:true}); moveDrag(x,y);
}
let lastOver=null;
function moveDrag(x,y){ if(!drag||!drag.started) return; drag.ghost.style.left=x+'px'; drag.ghost.style.top=y+'px';
  const d=dayAt(x,y); if(lastOver&&lastOver!==d) lastOver.classList.remove('over'); if(d){ d.classList.add('over'); lastOver=d; }
  const m=60; if(y<m) window.scrollBy(0,-12); else if(y>window.innerHeight-m) window.scrollBy(0,12); }
function endDrag(x,y){ if(!drag){ clearGhosts(); return; } const dd=drag; drag=null; clearGhosts(); lastOver=null;
  if(!dd.started) return; const d=dayAt(x,y); if(!d) return; const key=d.dataset.day;
  if(dd.kind==='item') place(dd.id,key); else move(dd.uid,dd.from,key); }
function sourceInfo(t){
  if(t.closest('a')) return null;
  const item=t.closest('.item'); if(item) return {kind:'item',id:item.dataset.id};
  const chip=t.closest('.chip'); if(chip && !t.closest('button')){ const from=chip.dataset.from; const p=(state.placements[from]||[]).find(p=>p.uid===chip.dataset.uid); if(p) return {kind:'chip',id:p.id,uid:p.uid,from}; }
  return null;
}
// mouse / pen
let pd=null;
document.addEventListener('pointerdown',e=>{ if(e.pointerType==='touch'||e.button!==0) return; const info=sourceInfo(e.target); if(!info) return; pd={info,x:e.clientX,y:e.clientY}; });
document.addEventListener('pointermove',e=>{ if(e.pointerType==='touch') return; if(pd&&!drag&&Math.hypot(e.clientX-pd.x,e.clientY-pd.y)>6){ startDrag(pd.info,e.clientX,e.clientY); document.body.style.userSelect='none'; } else if(drag) moveDrag(e.clientX,e.clientY); });
document.addEventListener('pointercancel',e=>{ if(e.pointerType!=='touch') cancelDrag(); });
window.addEventListener('blur',cancelDrag);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) cancelDrag(); });
document.addEventListener('pointerup',e=>{ if(e.pointerType==='touch') return; if(drag){ endDrag(e.clientX,e.clientY); suppressClick=true; setTimeout(()=>suppressClick=false,0); } pd=null; document.body.style.userSelect=''; });
// touch: long-press to drag, otherwise scroll / tap
let tp=null, suppressClick=false;
document.addEventListener('touchstart',e=>{ if(tp){ clearTimeout(tp.timer); tp=null; } if(e.touches.length>1){ cancelDrag(); return; } if(!drag) clearGhosts(); const info=sourceInfo(e.target); if(!info) return; const t=e.touches[0];
  tp={info,x:t.clientX,y:t.clientY,timer:setTimeout(()=>{ if(tp){ startDrag(tp.info,tp.x,tp.y); if(navigator.vibrate) try{navigator.vibrate(15);}catch(_){} } },320)}; },{passive:true});
document.addEventListener('touchmove',e=>{ const t=e.touches[0]; if(drag){ e.preventDefault(); moveDrag(t.clientX,t.clientY); return; }
  if(tp&&Math.hypot(t.clientX-tp.x,t.clientY-tp.y)>8){ clearTimeout(tp.timer); tp=null; } else if(tp){ tp.x=t.clientX; tp.y=t.clientY; } },{passive:false});
document.addEventListener('touchend',e=>{ if(tp){ clearTimeout(tp.timer); tp=null; } if(drag){ const t=e.changedTouches[0]; endDrag(t.clientX,t.clientY); suppressClick=true; setTimeout(()=>suppressClick=false,350); e.preventDefault(); } });
document.addEventListener('touchcancel',cancelDrag);
document.addEventListener('contextmenu',e=>{ if(e.target.closest('.item,.chip')) e.preventDefault(); });

// clicks
document.addEventListener('click',e=>{
  if(suppressClick) return;
  const t=e.target;
  if(t.closest('a.vid')) return;
  if(t.id==='tg'){ document.querySelector('.tray').classList.toggle('collapsed'); t.textContent=document.querySelector('.tray').classList.contains('collapsed')?'แสดง':'ซ่อน'; return; }
  if(t.id==='cancelsel'){ selected=null; render(); return; }
  if(t.id==='clearall'){ const c=document.getElementById('confirm'); c.innerHTML='ล้างจริงไหม? <button type="button" id="clearyes">ล้าง</button> <button type="button" id="clearno">ไม่</button>'; return; }
  if(t.id==='clearyes'){ mutate(()=>{ state.placements={}; }); return; }
  if(t.id==='clearno'){ document.getElementById('confirm').innerHTML=''; return; }
  const f=t.closest('[data-f]'); if(f){ filter=f.dataset.f; render(); return; }
  const act=t.closest('[data-act]');
  if(act){ const chip=act.closest('.chip'); const from=chip.dataset.from, uid=chip.dataset.uid;
    if(act.dataset.act==='done') mutate(()=>{ const p=(state.placements[from]||[]).find(p=>p.uid===uid); if(p) p.done=!p.done; });
    else mutate(()=>{ const a=state.placements[from]||[]; const ix=a.findIndex(p=>p.uid===uid); if(ix>=0) a.splice(ix,1); if(!a.length) delete state.placements[from]; });
    return; }
  const item=t.closest('.item'); if(item){ selected=(selected===item.dataset.id)?null:item.dataset.id; render(); return; }
  const day=t.closest('.day'); if(day&&selected&&!t.closest('.chip')){ const id=selected; selected=null; place(id,day.dataset.day); return; }
});
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('item')){ e.preventDefault(); e.target.click(); } if(e.key==='Escape'&&selected){ selected=null; render(); } });
document.addEventListener('submit',e=>{ if(e.target.id!=='addown') return; e.preventDefault(); const v=document.getElementById('owninput').value.trim(); if(!v) return; mutate(()=>{ state.custom.push({id:'own'+(state.seq++),title:v.slice(0,80)}); }); });

render();
if(window.claude&&window.claude.use){ window.claude.use('artifact').then(a=>{ artifact=a; if(localNewer&&a) schedulePublish(); }).catch(()=>{}); }
})();
</script>
</body>
</html>
